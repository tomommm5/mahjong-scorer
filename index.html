<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>麻雀スコアラー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div id="setup-screen">
    <h1>麻雀スコアラー</h1>
    
    <div class="form-group">
      <label>ゲームモード：</label>
      <input type="radio" name="game-mode" value="tonpuu" id="mode-tonpuu" checked>
      <label for="mode-tonpuu" class="inline-label">東風戦</label>
      <input type="radio" name="game-mode" value="hanchan" id="mode-hanchan">
      <label for="mode-hanchan" class="inline-label">半荘戦</label>
    </div>

    <div class="form-group">
      <label>プレイヤー名（起家から順に）：</label>
      <input type="text" id="p1-name" placeholder="プレイヤー1 (東)">
      <input type="text" id="p2-name" placeholder="プレイヤー2 (南)">
      <input type="text" id="p3-name" placeholder="プレイヤー3 (西)">
      <input type="text" id="p4-name" placeholder="プレイヤー4 (北)">
    </div>

    <div class="form-group">
      <label>開始点数：</label>
      <input type="radio" name="start-score" value="25000" id="score-25k" checked>
      <label for="score-25k" class="inline-label">25000点</label>
      <input type="radio" name="start-score" value="30000" id="score-30k">
      <label for="score-30k" class="inline-label">30000点</label>
    </div>

    <button id="start-btn">対局開始</button>
    
    <div class="history-section">
      <h3>過去の対局履歴</h3>
      <div id="history-container"></div>
    </div>
  </div>

  <div id="game-screen" style="display: none;">
    <div class="game-header">
      <h2 id="display-kyoku">東1局 0本場</h2>
      <p>供託: <span id="display-riichi-sticks">0</span>本 (<span id="display-riichi-points">0</span>点)</p>
    </div>
    
    <div id="display-players"></div>

    <div class="result-input-section">
      <h3>局の結果入力</h3>
      <input type="radio" name="kyoku-result" value="ryuukyoku" id="res-ryuukyoku" checked>
      <label for="res-ryuukyoku" class="inline-label">流局</label>
      <input type="radio" name="kyoku-result" value="tsumo" id="res-tsumo">
      <label for="res-tsumo" class="inline-label">ツモ</label>
      <input type="radio" name="kyoku-result" value="ron" id="res-ron">
      <label for="res-ron" class="inline-label">ロン</label>
      <button id="result-confirm-btn" style="margin-top: 10px;">詳細入力</button>
    </div>

    <div id="ryuukyoku-form" class="sub-form">
      <h4>聴牌（テンパイ）した人</h4>
      <div id="tenpai-checkboxes"></div>
      <button id="ryuukyoku-calc-btn">流局スコアを計算</button>
    </div>

    <div id="tsumo-form" class="sub-form">
      <h4>あがった人（ツモ）</h4>
      <div id="tsumo-player-radios"></div>
      <div class="form-group" style="margin-top: 10px;">
        <label for="tsumo-score-select">あがり点数：</label>
        <select id="tsumo-score-select"></select>
      </div>
      <button id="tsumo-calc-btn">ツモスコアを計算</button>
    </div>

    <div id="ron-form" class="sub-form">
      <h4>あがった人（ロン）</h4>
      <div id="ron-winner-radios"></div>
      <h4>振り込んだ人（放銃）</h4>
      <div id="ron-loser-radios"></div>
      <div class="form-group" style="margin-top: 10px;">
        <label for="ron-score-select">あがり点数：</label>
        <select id="ron-score-select"></select>
      </div>
      <button id="ron-calc-btn">ロンスコアを計算</button>
    </div>
  </div>

  <div id="result-screen" style="display: none;">
    <h2>対局結果</h2>
    <p id="result-desc"></p>
    <table border="1" style="width:100%; border-collapse:collapse; margin-bottom:20px;">
      <thead>
        <tr>
          <th>順位</th>
          <th>名前</th>
          <th>最終点数</th>
          <th>差分</th>
        </tr>
      </thead>
      <tbody id="result-table-body"></tbody>
    </table>
    <button id="back-to-title-btn">タイトルに戻る</button>
  </div>

</div>

<script src="app.js" defer></script>
</body>
</html>
